<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>古文フリッカー</title>
<link rel="icon" href="https://keni-77.github.io/icon.ico">
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=M+PLUS+1p:wght@400;700;900&display=swap');

:root {
  /* カラーパレット */
  --bg-base: #050814;
  --bg-panel: rgba(13, 17, 30, 0.8);
  --primary: #00f0ff;
  --primary-glow: rgba(0, 240, 255, 0.4);
  --secondary: #ff007f;
  --secondary-glow: rgba(255, 0, 127, 0.4);
  --accent: #ffe600;
  --success: #00ff66;
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
  --border-color: rgba(0, 240, 255, 0.2);
  --border-color-dim: rgba(255, 255, 255, 0.1);
  
  /* フォント */
  --font-en: 'Orbitron', sans-serif;
  --font-jp: 'M PLUS 1p', sans-serif;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: var(--font-jp);
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}

body {
  background-color: var(--bg-base);
  color: var(--text-main);
  display: flex;
  justify-content: center;
  min-height: 100vh;
  overflow-x: hidden;
  /* サイバーパンクなグリッド背景 */
  background-image: 
    linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
  background-size: 30px 30px;
  background-position: center center;
}

button, input { font: inherit; }
button { cursor: pointer; outline: none; }
.hidden { display: none !important; }

#app {
  width: 100%;
  max-width: 560px;
  min-height: 100vh;
  padding: 20px;
  position: relative;
  display: flex;
  flex-direction: column;
}

/* 画面遷移アニメーション */
.screen {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  animation: slideIn 0.3s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
}

@keyframes slideIn {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  50% { transform: translateX(6px); }
  75% { transform: translateX(-6px); }
}
@keyframes popIn {
  from { opacity: 0; transform: scale(0.9); }
  to { opacity: 1; transform: scale(1); }
}

/* ヘッダー・タイトル */
h1 {
  font-family: var(--font-en);
  font-size: 2.2rem;
  color: #fff;
  text-shadow: 0 0 10px var(--primary), 0 0 20px var(--primary);
  letter-spacing: 3px;
  text-align: center;
  margin-bottom: 0;
  line-height: 1.2;
}

.subtitle {
  font-family: var(--font-en);
  font-size: 0.8rem;
  color: var(--primary);
  letter-spacing: 6px;
  margin: 5px 0 25px;
  text-align: center;
  font-weight: 700;
}

/* 汎用コンポーネント */
.top-settings {
  position: absolute;
  right: 20px;
  top: 20px;
  width: 44px;
  height: 44px;
  border-radius: 12px;
  border: 1px solid var(--border-color);
  background: var(--bg-panel);
  color: var(--primary);
  font-size: 1.2rem;
  z-index: 20;
  box-shadow: 0 0 10px rgba(0,0,0,0.5);
  transition: all 0.2s;
}
.top-settings:active { transform: scale(0.9); background: var(--primary); color: #000; }

.card {
  width: 100%;
  background: var(--bg-panel);
  border: 1px solid var(--border-color-dim);
  border-radius: 16px;
  padding: 20px;
  margin: 10px 0;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
}

/* プロフィール周り */
.profile {
  display: flex;
  align-items: center;
  gap: 15px;
  border: 1px solid var(--primary);
  background: linear-gradient(90deg, rgba(0,240,255,0.05), transparent);
  border-radius: 16px;
  padding: 15px;
  box-shadow: inset 0 0 20px rgba(0, 240, 255, 0.05);
}
.avatar {
  width: 60px;
  height: 60px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2.2rem;
  background: rgba(0,0,0,0.5);
  border: 2px solid var(--primary);
  flex: none;
  box-shadow: 0 0 15px var(--primary-glow);
}
.name { font-weight: 900; font-size: 1.2rem; letter-spacing: 1px; }
.best { font-family: var(--font-en); color: var(--accent); font-size: 0.9rem; margin-top: 4px; letter-spacing: 1px; }

/* ボタンデザイン */
.btn {
  width: 100%;
  padding: 15px;
  margin: 8px 0;
  border: 1px solid var(--primary);
  border-radius: 12px;
  background: linear-gradient(135deg, rgba(0,240,255,0.1), rgba(0,0,0,0.8));
  color: #fff;
  font-weight: 700;
  font-size: 1rem;
  letter-spacing: 2px;
  text-shadow: 0 0 5px var(--primary);
  box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  transition: all 0.15s ease;
  position: relative;
  overflow: hidden;
}
.btn::before {
  content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
  transition: all 0.4s ease;
}
.btn:active::before { left: 100%; }
.btn:active { transform: translateY(2px) scale(0.98); box-shadow: 0 0 0 transparent; }
.btn.green { border-color: var(--success); background: linear-gradient(135deg, rgba(0,255,102,0.1), rgba(0,0,0,0.8)); text-shadow: 0 0 5px var(--success); }
.btn.gray { border-color: #475569; background: #1e293b; text-shadow: none; color: var(--text-muted); }
.btn.small { width: auto; font-size: 0.8rem; padding: 8px 16px; margin: 0; border-radius: 8px; letter-spacing: 0; }

.section-title{width:100%;font-family:var(--font-en);color:var(--primary);font-size:.9rem;margin:15px 0 10px;letter-spacing:2px;border-bottom:1px solid var(--border-color);padding-bottom:5px;}

/* モーダル・入力 */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px);
  z-index: 100; display: flex; align-items: center; justify-content: center; padding: 20px;
}
.modal {
  width: 100%; max-width: 400px; background: #0b0f19;
  border: 1px solid var(--primary); border-radius: 20px; padding: 25px;
  box-shadow: 0 0 40px var(--primary-glow); animation: popIn 0.2s ease-out;
}
.modal h2 { font-family: var(--font-en); color: var(--primary); font-size: 1.3rem; margin-bottom: 15px; text-align: center; letter-spacing: 2px; }
input {
  width: 100%; padding: 15px; border: 1px solid var(--border-color); border-radius: 12px;
  background: rgba(0,0,0,0.5); color: #fff; font-size: 1rem; font-weight: 700;
  outline: none; text-align: center; margin: 10px 0; transition: border 0.2s;
}
input:focus { border-color: var(--primary); box-shadow: 0 0 10px var(--primary-glow); }
.avatar-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 15px 0 25px; }
.avatar-item {
  background: rgba(255,255,255,0.05); border: 1px solid transparent; border-radius: 12px;
  padding: 10px; font-size: 1.8rem; text-align: center; cursor: pointer; transition: all 0.2s;
}
.avatar-item:hover { background: rgba(255,255,255,0.1); }
.avatar-item.selected {
  border-color: var(--success); background: rgba(0,255,102,0.1); box-shadow: 0 0 15px rgba(0,255,102,0.3); transform: scale(1.05);
}

/* ゲーム画面 HUD */
#hud { width: 100%; display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
.progress { height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; }
#progress-bar { height: 100%; width: 0; background: linear-gradient(90deg, var(--primary), var(--secondary)); transition: width 0.3s ease-out; box-shadow: 0 0 10px var(--primary); }
.scoreboard { display: flex; justify-content: space-between; align-items: center; font-family: var(--font-en); font-size: 1rem; }
.score { background: rgba(0,0,0,0.6); border: 1px solid var(--border-color-dim); padding: 8px 15px; border-radius: 10px; color: var(--text-muted); }
.score span { color: #fff; font-size: 1.2rem; font-weight: 900; margin-left: 5px; text-shadow: 0 0 5px rgba(255,255,255,0.5); }
#my-score-box span { color: var(--primary); text-shadow: 0 0 8px var(--primary-glow); }

/* ゲーム画面 問題・パネル */
.word-card {
  width: 100%;
  background: radial-gradient(circle at center, rgba(0,240,255,0.1) 0%, rgba(0,0,0,0.6) 100%);
  border: 1px solid var(--primary); border-radius: 20px; padding: 40px 10px; text-align: center;
  box-shadow: 0 0 30px var(--primary-glow); margin-bottom: 25px; position: relative;
}
#word-display { font-size: 4rem; font-weight: 900; color: #fff; text-shadow: 0 0 15px var(--primary), 0 0 30px var(--primary); letter-spacing: 5px; line-height: 1; }
#status-text { font-family: var(--font-en); font-size: 0.9rem; color: var(--accent); margin-top: 15px; letter-spacing: 2px; font-weight: 700; }

.panel {
  display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; width: 100%;
  animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.tap {
  background: rgba(15, 23, 42, 0.9);
  border: 1px solid rgba(255,255,255,0.1);
  border-bottom: 4px solid rgba(0,240,255,0.3);
  color: #fff; font-size: 1.4rem; font-weight: 900;
  border-radius: 14px; padding: 18px 0; flex: 1 1 calc(20% - 12px); min-width: 60px;
  transition: all 0.1s; text-shadow: 0 2px 4px rgba(0,0,0,0.8);
}
.tap.wide { flex: 1 1 calc(50% - 12px); font-size: 1.2rem; }
.tap:active {
  transform: translateY(4px); border-bottom-width: 0px; margin-bottom: 4px;
  background: var(--primary); color: #000; text-shadow: none; box-shadow: 0 0 15px var(--primary);
}


/* フリック入力 */
.flick-area {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  touch-action: none;
}

.flick-hint {
  min-height: 24px;
  color: var(--text-muted);
  font-size: 0.85rem;
  text-align: center;
  letter-spacing: 1px;
}

.flick-grid {
  width: min(100%, 390px);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.flick-key {
  position: relative;
  height: 78px;
  border: 1px solid rgba(0,240,255,0.22);
  border-bottom: 4px solid rgba(0,240,255,0.3);
  border-radius: 16px;
  background: rgba(15,23,42,0.92);
  color: #fff;
  font-size: 1.65rem;
  font-weight: 900;
  text-shadow: 0 0 8px var(--primary);
  touch-action: none;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

.flick-key.active {
  background: rgba(0,240,255,0.18);
  border-color: var(--primary);
  box-shadow: 0 0 20px var(--primary-glow);
  transform: scale(0.97);
}

.flick-key::after {
  content: '↖  ↑  ↗\\A←   ●   →\\A↙  ↓  ↘';
  white-space: pre;
  position: absolute;
  inset: auto 0 5px 0;
  color: rgba(148,163,184,0.55);
  font-size: 0.45rem;
  line-height: 1.15;
  font-weight: 700;
  pointer-events: none;
}

.flick-spacer {
  height: 78px;
}

.flick-direction {
  width: min(100%, 390px);
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  grid-template-areas:
    ". up ."
    "left guide right"
    ". down .";
  gap: 7px;
  align-items: center;
  text-align: center;
  font-size: 0.78rem;
  font-weight: 900;
}

.flick-arrow {
  min-height: 42px;
  padding: 6px 4px;
  border: 1px solid rgba(0,240,255,0.18);
  border-radius: 10px;
  background: rgba(15,23,42,0.7);
  color: #fff;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 2px;
}

.flick-arrow b {
  color: var(--primary);
  font-size: 0.7rem;
}

.flick-arrow-left { grid-area: left; }
.flick-arrow-up { grid-area: up; }
.flick-arrow-right { grid-area: right; }
.flick-arrow-down { grid-area: down; }

.flick-stage-guide {
  grid-area: guide;
  color: var(--text-muted);
  font-size: 0.58rem;
  line-height: 1.25;
}

.flick-direction .dir-center {
  color: var(--primary);
}

@media (max-width: 420px) {
  .flick-grid { gap: 8px; }
  .flick-key { height: 72px; font-size: 1.5rem; }
  .flick-spacer { height: 72px; }
}


/* かな入力式フリックUI */
.flick-area {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  touch-action: none;
}

.flick-grid {
  width: min(100%, 390px);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.flick-key {
  position: relative;
  height: 78px;
  border: 1px solid rgba(0,240,255,0.22);
  border-bottom: 4px solid rgba(0,240,255,0.3);
  border-radius: 16px;
  background: rgba(15,23,42,0.92);
  color: #fff;
  font-size: 1.65rem;
  font-weight: 900;
  text-shadow: 0 0 8px var(--primary);
  touch-action: none;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  overflow: visible;
  z-index: 1;
}

.flick-key.active {
  background: rgba(0,240,255,0.18);
  border-color: var(--primary);
  box-shadow: 0 0 20px var(--primary-glow);
  transform: scale(0.97);
  z-index: 100;
}

.key-label { pointer-events:none; }

.flick-popup {
  display: none;
  position: absolute;
  left: 50%;
  top: 50%;
  width: 252px;
  height: 252px;
  transform: translate(-50%, -50%);
  z-index: 200;
  pointer-events: none;
}

.flick-key.active .flick-popup {
  display: block;
  animation: flickPopupIn 0.12s cubic-bezier(.2,.9,.25,1.2) both;
}

@keyframes flickPopupIn {
  from { opacity: 0; transform: translate(-50%, -50%) scale(.82); }
  to   { opacity: 1; transform: translate(-50%, -50%) scale(1); }
}

/* 出てくる5ブロックは、押したキーと同じ78px四方 */
.flick-option {
  position: absolute;
  width: 78px;
  height: 78px;
  box-sizing: border-box;
  border: 1px solid rgba(0,240,255,0.55);
  border-radius: 16px;
  background: rgba(10,20,38,0.98);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  line-height: 1.1;
  font-size: 0.68rem;
  font-weight: 900;
  white-space: normal;
  box-shadow: 0 5px 18px rgba(0,0,0,0.45);
  transition:
    transform 0.12s cubic-bezier(.2,.9,.25,1.25),
    background 0.12s ease,
    border-color 0.12s ease,
    box-shadow 0.12s ease;
  will-change: transform;
}

.opt-center {
  left: 87px;
  top: 87px;
  font-size: 1.45rem;
  background: rgba(0,240,255,0.18);
  border-color: var(--primary);
}

.opt-up {
  left: 87px;
  top: 0;
}

.opt-left {
  left: 0;
  top: 87px;
}

.opt-right {
  right: 0;
  top: 87px;
}

.opt-down {
  left: 87px;
  bottom: 0;
}

.flick-option.chosen {
  background: rgba(0,240,255,0.34);
  border-color: var(--primary);
  box-shadow: 0 0 12px var(--primary-glow), 0 0 28px rgba(0,240,255,0.22);
  transform: scale(1.07);
}

/* 上下を選んだ後も、ブロックサイズは最初と完全に同じ。
   上なら左上・右上、下なら左下・右下に配置する。 */
.flick-popup.secondary-mode {
  display: block;
}

.flick-popup.secondary-mode .opt-up,
.flick-popup.secondary-mode .opt-down,
.flick-popup.secondary-mode .opt-center {
  display: none;
}

.flick-popup.secondary-mode .opt-left,
.flick-popup.secondary-mode .opt-right {
  display: flex;
  width: 78px;
  height: 78px;
  top: auto;
}

.flick-popup.secondary-mode.stage-up .opt-left {
  left: 0;
  top: 0;
}

.flick-popup.secondary-mode.stage-up .opt-right {
  right: 0;
  top: 0;
}

.flick-popup.secondary-mode.stage-down .opt-left {
  left: 0;
  bottom: 0;
}

.flick-popup.secondary-mode.stage-down .opt-right {
  right: 0;
  bottom: 0;
}

/* 選択中は「吸い付く」ように軽く弾ませる */
.flick-popup.secondary-mode .flick-option.chosen {
  transform: scale(1.07);
}

@media (max-width: 420px) {
  .flick-grid { gap: 8px; }
  .flick-key { height: 72px; font-size: 1.5rem; }
  .flick-popup { width: 228px; height: 228px; }
  .flick-option { width: 72px; height: 72px; }
  .opt-center { left: 78px; top: 78px; }
  .opt-up { left: 78px; }
  .opt-left { top: 78px; }
  .opt-right { top: 78px; }
  .opt-down { left: 78px; }
  .flick-popup.secondary-mode .opt-left,
  .flick-popup.secondary-mode .opt-right { width: 72px; height: 72px; }
}

/* リザルト画面 */
.result-stat { font-family: var(--font-en); font-size: 1.3rem; color: var(--primary); text-align: center; margin: 15px 0; letter-spacing: 1px; }
.new-record { color: var(--success); font-family: var(--font-en); font-weight: 900; text-shadow: 0 0 15px var(--success); font-size: 1.2rem; margin-bottom: 10px; animation: popIn 0.5s infinite alternate; }
.ranking { width: 100%; margin: 20px 0; background: var(--bg-panel); border-radius: 16px; border: 1px solid var(--border-color-dim); padding: 10px; }
.rank-row { display: flex; align-items: center; padding: 12px 10px; border-bottom: 1px solid rgba(255,255,255,0.05); gap: 12px; }
.rank-row:last-child { border-bottom: none; }
.rank-row .rank { width: 35px; font-family: var(--font-en); color: var(--accent); font-weight: 900; font-size: 1.1rem; }
.rank-row .rname { flex: 1; font-weight: 700; font-size: 1.1rem; }
.rank-row .rscore { font-family: var(--font-en); color: var(--success); font-weight: 900; font-size: 1.2rem; text-shadow: 0 0 10px rgba(0,255,102,0.3); }

/* オーバーレイ演出 */
.overlay {
  position: fixed; inset: 0; background: rgba(5,8,20,0.85); backdrop-filter: blur(3px);
  z-index: 80; display: flex; align-items: center; justify-content: center; flex-direction: column;
  font-family: var(--font-en); font-size: 4.5rem; font-weight: 900; text-align: center;
  color: var(--primary); text-shadow: 0 0 20px var(--primary), 0 0 40px var(--primary);
  letter-spacing: 5px; animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.overlay-sub { font-family: var(--font-jp); font-size: 1.5rem; margin-top: 10px; color: #fff; text-shadow: none; letter-spacing: 2px; }

/* モード選択 */
.mode-tabs {
  width: 100%;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin: 10px 0 15px;
}
.mode-tab {
  position: relative;
  border: 1px solid var(--border-color);
  border-radius: 12px;
  padding: 13px 10px;
  background: rgba(0,0,0,0.45);
  color: var(--text-muted);
  font-family: var(--font-en);
  font-weight: 900;
  letter-spacing: 2px;
}
.mode-tab.active {
  color: #fff;
  border-color: var(--primary);
  background: rgba(0,240,255,0.1);
  box-shadow: 0 0 15px var(--primary-glow);
}
.mode-tab.locked {
  cursor: not-allowed;
  opacity: 0.45;
  border-color: #475569;
}
.mode-tab .lock {
  margin-left: 6px;
  font-family: var(--font-jp);
}
.training-games {
  width: 100%;
  display: grid;
  gap: 10px;
}
.game-select-card {
  width: 100%;
  text-align: left;
  border: 1px solid var(--border-color);
  border-radius: 14px;
  padding: 16px;
  background: linear-gradient(135deg, rgba(0,240,255,0.08), rgba(0,0,0,0.65));
  color: #fff;
  transition: all 0.15s ease;
}
.game-select-card:active {
  transform: translateY(2px) scale(0.99);
}
.game-select-card .game-name {
  font-weight: 900;
  font-size: 1.05rem;
  letter-spacing: 1px;
}
.game-select-card .game-desc {
  color: var(--text-muted);
  font-size: 0.78rem;
  line-height: 1.6;
  margin-top: 5px;
}
.game-select-card .game-arrow {
  float: right;
  color: var(--primary);
  font-family: var(--font-en);
}

.notice { font-size: 0.75rem; color: #64748b; text-align: center; margin-top: 15px; line-height: 1.6; }
</style>
</head>
<body>
<div id="app">

<button class="top-settings" onclick="openSettings()">⚙️</button>

<!-- PROFILE SETUP -->
<section id="screen-setup" class="screen hidden">

  <div class="card">

    <div class="section-title">アバター選択</div>
    <div id="setup-avatars" class="avatar-grid"></div>
    <button class="btn" onclick="completeSetup()" style="margin-top: 10px;">SYSTEM START</button>
  </div>
</section>

<!-- TITLE / MODE SELECT -->
<section id="screen-title" class="screen hidden">
  <h1>KOBUN FLICKER</h1>
  <div class="subtitle">ver2.1</div>

  <div class="profile" style="width:100%; margin-bottom:15px">
    <div class="avatar" id="title-avatar">👤</div>
    <div>
      <div class="name" id="title-name">---</div>
      <div class="best">
        BEST AVG<br>
        <span style="font-size:0.6rem; font-family:var(--font-en);">
          KOBUN : <span id="title-best-kobun" style="font-size:0.6rem; font-family:var(--font-en);">--</span><br>
          GENDAIBUN : <span id="title-best-genbun" style="font-size:0.6rem; font-family:var(--font-en);">--</span>
        </span>
      </div>
    </div>
  </div>

  <div class="mode-tabs" role="tablist" aria-label="モード選択">
    <button class="mode-tab active" id="tab-training" onclick="selectModeTab('training')">TRAINING</button>
    <button class="mode-tab locked" id="tab-battle" disabled aria-disabled="true">BATTLE <span class="lock">🔒</span></button>
  </div>

  <div id="training-panel" class="card" style="margin-top:0; text-align:left;">
    <div style="font-family:var(--font-en); color:var(--primary); font-size:0.9rem; letter-spacing:2px; margin-bottom:10px; text-align:center;">
      TRAINING MODE
    </div>

    <div class="training-games">
      <button class="game-select-card" onclick="startSolo()">
        <span class="game-arrow">▶</span>
        <div class="game-name">古文フリッカー</div>
        <div class="game-desc">古文動詞の活用をフリックで判定。全10問をすべて正解してクリア。</div>
      </button>

      <button class="game-select-card" onclick="startGenbun()">
        <span class="game-arrow">▶</span>
        <div class="game-name">現代文フリッカー</div>
        <div class="game-desc">現代日本語の動詞の活用をフリックで判定。全10問をすべて正解してクリア。</div>
      </button>
    </div>
  </div>

  <div class="notice">
    BATTLE MODE は現在開発中です。
  </div>
</section>

function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
}
function makeAvatarGrid(containerId){
  const el = document.getElementById(containerId);
  if(!el) return;
  el.innerHTML = '';
  AVATARS.forEach(a => {
    const d = document.createElement('div');
    d.className = 'avatar-item' + (a === myAvatar ? ' selected' : '');
    d.textContent = a;
    d.onclick = () => {
      myAvatar = a;
      el.querySelectorAll('.avatar-item').forEach(x => x.classList.remove('selected'));
      d.classList.add('selected');
    };
    el.appendChild(d);
  });
}

      : '押したまま上下へ → 一段/二段を選択 → 指を離す';

/*
  古文の回答ルール
  ─────────────────────────
  かなキーから
    左  → 四段活用
    右  → 変格活用
    上  → 上
    下  → 下

  上を選んだ後
    左 → 上一段活用
    右 → 上二段活用

  下を選んだ後
    左 → 下一段活用
    右 → 下二段活用

  「指を離した瞬間」にだけ判定する。

  現代文：
    左 → 五段活用 / 右 → 変格活用
    上 → 上一段活用 / 下 → 下一段活用
*/
function submitFlick(gyo, dx, dy){
  if(!isPlaying || isWaitingNext) return;
  const ax = Math.abs(dx), ay = Math.abs(dy);
  const threshold = 30;

  if(ax > ay && ax >= threshold){
    checkFlickAnswer(
      mode === 'genbun'
        ? (dx < 0 ? '五段活用' : '変格活用')
        : (dx < 0 ? '四段活用' : '変格活用'),
      null,
      gyo
    );
  }else if(ay >= threshold && mode === 'genbun'){
    checkFlickAnswer(dy < 0 ? '上一段活用' : '下一段活用', null, gyo);
  }else if(ay >= threshold){
    wrong();
  }
}

let flickStage = null;

function checkFlickAnswer(answer, verticalType, gyo){
  if(!isPlaying || isWaitingNext) return;

  // 行が違えば、活用が合っていても絶対に正解にしない。
  if(gyo !== currentQ.gyo){
    wrong();
    return;
  }

  if(mode === 'genbun'){
    const isModernCorrect =
      answer === currentQ.type ||
      (answer === '変格活用' && currentQ.type.includes('変格活用'));
    if(isModernCorrect){
      solvedLocally();
    }else{
      wrong();
    }
    return;
  }

  if(verticalType === '上' || verticalType === '下'){
    if(currentQ.type === verticalType && answer === currentQ.sub){
      solvedLocally();
    }else{
      wrong();
    }
    return;
  }

  if(answer === currentQ.type){
    solvedLocally();
  }else{
    wrong();
  }
}

function setPopupLabels(key, stage=null){
  const p = key.querySelector('.flick-popup');
  if(!p) return;

  p.classList.remove('stage-up','stage-down','secondary-mode');

  p.querySelector('.opt-center').textContent = key.dataset.gyo;

  if(mode === 'genbun'){
    p.querySelector('.opt-up').textContent = '上一段活用';
    p.querySelector('.opt-down').textContent = '下一段活用';
    p.querySelector('.opt-left').textContent = '五段活用';
    p.querySelector('.opt-right').textContent = '変格活用';
    return;
  }

  p.querySelector('.opt-up').textContent = '上';
  p.querySelector('.opt-down').textContent = '下';

  if(stage === '上'){
    p.querySelector('.opt-left').textContent = '上一段活用';
    p.querySelector('.opt-right').textContent = '上二段活用';
  }else if(stage === '下'){
    p.querySelector('.opt-left').textContent = '下一段活用';
    p.querySelector('.opt-right').textContent = '下二段活用';
  }else{
    p.querySelector('.opt-left').textContent = '四段活用';
    p.querySelector('.opt-right').textContent = '変格活用';
  }
}

function updateFlickPopupStage(key, stage){
  const p = key.querySelector('.flick-popup');
  if(!p) return;

  setPopupLabels(key, stage);

  p.querySelectorAll('.flick-option').forEach(o => o.classList.remove('chosen'));

  if(mode === 'genbun'){
    // 現代文は上下フリックだけで上一段/下一段を確定する。
    p.classList.remove('secondary-mode','stage-up','stage-down');
    p.querySelector(stage === '上' ? '.opt-up' : '.opt-down')?.classList.add('chosen');
    return;
  }

  p.classList.add('secondary-mode', stage === '上' ? 'stage-up' : 'stage-down');
  // 上/下を選択した時点で、中央に戻れるよう中央キーを常に残す。
  p.querySelector('.opt-center')?.classList.add('chosen');
}

function initFlickInput(){
  document.querySelectorAll('.flick-key').forEach(key => {
    key.addEventListener('pointerdown', e => {
      if(!isPlaying || isWaitingNext) return;

      const popup = key.querySelector('.flick-popup');
      setPopupLabels(key, null);
      popup.classList.remove('secondary-mode','stage-up','stage-down');
      popup.setAttribute('aria-hidden','false');

      flickPointer = {
        id:e.pointerId,
        key,
        gyo:key.dataset.gyo,
        x:e.clientX,
        y:e.clientY,
        stage:null,
        secondaryDirection:null
      };

      key.classList.add('active');
      key.setPointerCapture?.(e.pointerId);
      e.preventDefault();
    });

    key.addEventListener('pointermove', e => {
      if(!flickPointer || flickPointer.id !== e.pointerId) return;

      const f = flickPointer;
      const dx = e.clientX - f.x;
      const dy = e.clientY - f.y;
      const ax = Math.abs(dx);
      const ay = Math.abs(dy);
      const threshold = 22;
      const centerRadius = 26;

      f.key.querySelectorAll('.flick-option').forEach(o => o.classList.remove('chosen'));

      // 中央へ戻ったら、必ず最初の「上下左右」表示へ戻す。
      if(ax < centerRadius && ay < centerRadius){
        if(f.stage !== null){
          f.stage = null;
          f.secondaryDirection = null;
          const popup = f.key.querySelector('.flick-popup');
          popup.classList.remove('secondary-mode','stage-up','stage-down');
          setPopupLabels(f.key, null);
          document.getElementById('flick-hint').textContent =
            '上下左右から選択できます';
        }
        f.key.querySelector('.opt-center')?.classList.add('chosen');
        e.preventDefault();
        return;
      }

      if(!f.stage){
        // 第1段階：上下左右。
        // 上下方向を少し優先し、斜めに入ったときも自然に上下へ吸着する。
        if(ay >= threshold && ay >= ax * 0.72){
          f.stage = dy < 0 ? '上' : '下';
          f.secondaryDirection = null;
          updateFlickPopupStage(f.key, f.stage);
          f.key.querySelector(dy < 0 ? '.opt-up' : '.opt-down')?.classList.add('chosen');

          document.getElementById('flick-hint').textContent =
            f.stage === '上'
              ? '左上⋯上一段活用　右上⋯上二段活用'
              : '左下⋯下一段活用　右下⋯下二段活用';
        }else if(ax >= threshold && ax > ay * 0.95){
          f.key.querySelector(dx < 0 ? '.opt-left' : '.opt-right')?.classList.add('chosen');
        }else{
          f.key.querySelector('.opt-center')?.classList.add('chosen');
        }
      }else{
        if(mode === 'genbun'){
          // 現代文は上下を選んだ時点で候補を固定。左右の第2段階は使わない。
          f.secondaryDirection = null;
          f.key.querySelector(f.stage === '上' ? '.opt-up' : '.opt-down')?.classList.add('chosen');
          e.preventDefault();
          return;
        }

        // 第2段階：上なら左上/右上、下なら左下/右下。
        // 縦方向を維持しつつ左右へ動かしたときだけ確定候補を切り替える。
        const verticalOK = f.stage === '上' ? dy < -8 : dy > 8;

        if(verticalOK && dx < -threshold){
          f.secondaryDirection = 'left';
          f.key.querySelector('.opt-left')?.classList.add('chosen');
        }else if(verticalOK && dx > threshold){
          f.secondaryDirection = 'right';
          f.key.querySelector('.opt-right')?.classList.add('chosen');
        }else{
          f.secondaryDirection = null;
        }
      }

      e.preventDefault();
    });

    key.addEventListener('pointerup', e => {
      if(!flickPointer || flickPointer.id !== e.pointerId) return;

      const f = flickPointer;
      const dx = e.clientX - f.x;
      const dy = e.clientY - f.y;
      const stage = f.stage;
      const secondaryDirection = f.secondaryDirection;

      f.key.classList.remove('active');
      f.key.querySelector('.flick-popup').setAttribute('aria-hidden','true');
      f.key.querySelector('.flick-popup').classList.remove('secondary-mode','stage-up','stage-down');
      f.key.querySelectorAll('.flick-option').forEach(o => o.classList.remove('chosen'));

      // 指を離した瞬間だけ確定。
      if(stage === '上' || stage === '下'){
        if(mode === 'genbun'){
          checkFlickAnswer(stage === '上' ? '上一段活用' : '下一段活用', null, f.gyo);
        }else if(secondaryDirection === 'left'){
          checkFlickAnswer('一段活用', stage, f.gyo);
        }else if(secondaryDirection === 'right'){
          checkFlickAnswer('二段活用', stage, f.gyo);
        }else if(Math.abs(dx) < 26 && Math.abs(dy) < 26){
          // 中央で離した場合はキャンセル。
          document.getElementById('flick-hint').textContent = '中央に戻しました';
        }else{
          wrong();
        }
      }else{
        submitFlick(f.gyo, dx, dy);
      }

      flickPointer = null;
      e.preventDefault();
    });

    key.addEventListener('pointercancel', e => {
      if(flickPointer && flickPointer.id === e.pointerId){
        flickPointer.key.classList.remove('active');
        flickPointer.key.querySelector('.flick-popup').setAttribute('aria-hidden','true');
        flickPointer.key.querySelector('.flick-popup').classList.remove('secondary-mode','stage-up','stage-down');
        flickPointer = null;
      }
    });
  });
}
function wrong(){
  const card = document.getElementById('word-card');
  card.style.animation = 'none';
  card.offsetHeight;
  card.style.animation = 'shake 0.4s';
  navigator.vibrate && navigator.vibrate(50); // モバイル向けの振動
}

function solvedLocally(){
  if(!isPlaying || isWaitingNext) return;
  isWaitingNext = true;
  totalSolveTime += (performance.now() - startTime) / 1000;
  myScore++;
  updateScoreUI();
  showOverlay('POINT!', '');
  
  setTimeout(() => {
    hideOverlay();
    if(qIndex + 1 < MAX_Q) { qIndex++; setQuestion(); }
    else endGame();
  }, 700);
}

function endGame(){
  isPlaying = false;
  isWaitingNext = true;
  hideOverlay();
  showScreen('screen-result');

  const title = document.getElementById('result-title');
  const detail = document.getElementById('result-detail');
  const newRecord = document.getElementById('new-record');
  const bestEl = document.getElementById('result-best');

  newRecord.classList.add('hidden');
  document.getElementById('progress-bar').style.width = '100%';

  title.textContent = 'MISSION CLEAR';
  title.style.color = "var(--primary)";

  const avg = totalSolveTime / Math.max(1, myScore);
  bestAvg = parseFloat(localStorage.getItem(currentBestKey));
  if(!Number.isFinite(bestAvg)) bestAvg = null;
  let record = false;

  if(bestAvg === null || avg < bestAvg){
    bestAvg = avg;
    localStorage.setItem(currentBestKey, bestAvg.toFixed(4));
    record = true;
  }

  detail.innerHTML =
    `AVG TIME: <span style="color:var(--primary); font-family:var(--font-en); font-size:1.8rem">${avg.toFixed(2)}</span> s`;

  bestEl.textContent = `YOUR BEST: ${bestAvg.toFixed(2)}s`;
  document.getElementById('play-again-btn').onclick = mode === 'genbun' ? startGenbun : startSolo;
  if(record) newRecord.classList.remove('hidden');
  updateProfileUI();
}

function confirmLeaveGame(){
  if(confirm('現在のトレーニングを放棄して離脱しますか？')){
    isPlaying = false; hideOverlay(); showScreen('screen-title');
  }
}

// ---------- 初期化 ----------
window.addEventListener('DOMContentLoaded', () => {
  makeAvatarGrid('setup-avatars');
  initFlickInput();
  if(!myName){
    showScreen('screen-setup');
  } else {
      updateProfileUI();
    showScreen('screen-title');
  }
});
</script>
